<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NutriVision AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-white">Create <span class="text-emerald-400">Account</span></h1>
            <p class="text-slate-400 text-sm mt-1">We'll auto-calculate your BMI & daily calorie target</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div class="mb-4 p-3 rounded-lg text-sm bg-red-500/20 text-red-300 border border-red-500/40">
            {{ msg }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/register" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Username</label>
                    <input type="text" name="username" required
                        class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Email</label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Height (cm)</label>
                    <input type="number" name="height_cm" value="170" min="100" max="240" required
                        class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Weight (kg)</label>
                    <input type="number" name="weight_kg" value="70" min="30" max="250" step="0.5" required
                        class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Age</label>
                    <input type="number" name="age" value="22" min="12" max="100" required
                        class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Gender</label>
                    <select name="gender"
                        class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required minlength="4"
                    class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
            </div>

            <button type="submit"
                class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg transition">
                Sign Up & Calculate BMI
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Already have an account?
            <a href="/login" class="text-emerald-400 hover:underline font-medium">Log in</a>
        </p>
    </div>
</body>

</html>
