<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NutriVision AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <span
                class="inline-block px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-2">
                ML Food & Health Suite
            </span>
            <h1 class="text-3xl font-bold text-white">NutriVision <span class="text-emerald-400">AI</span></h1>
            <p class="text-slate-400 text-sm mt-1">Sign in to track calories, macros & BMI</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div
            class="mb-4 p-3 rounded-lg text-sm {{ 'bg-red-500/20 text-red-300 border border-red-500/40' if category == 'error' else 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' }}">
            {{ msg }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Username or Email</label>
                <input type="text" name="username" required placeholder="Enter username or email"
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 focus:border-emerald-400 focus:outline-none">
            </div>
            <button type="submit"
                class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-lg transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            New here?
            <a href="/register" class="text-emerald-400 hover:underline font-medium">Create an account</a>
        </p>
    </div>
</body>

</html>
